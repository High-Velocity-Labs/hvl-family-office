        <!-- Set 409A FMV Collapsible Form Card -->
        <div id="equity-fmv-card" class="equity-form-card" hidden>
            <div class="equity-form-card-header">
                <h4 class="equity-form-card-title">Record 409A Fair Market Value (FMV) by Date</h4>
                <button type="button" id="btn-close-equity-fmv" class="btn btn-secondary btn-sm">✕ Close</button>
            </div>
            <form id="form-equity-fmv" class="equity-form-grid">
                <div>
                    <label class="form-label">Company</label>
                    <select class="form-select form-select-sm equity-form-select" id="input-fmv-company">
                        {% if ssr_equity and ssr_equity.companies %}
                            {% for c in ssr_equity.companies %}
                            <option value="{{ c.company_id }}" {% if not is_cons and (c.company_id | string) == (active_cid | string) %}selected{% endif %}>{{ c.company_name }} ({{ c.ticker_or_private }})</option>
                            {% endfor %}
                        {% else %}
                            <option value="1">Primary Company</option>
                        {% endif %}
                    </select>
                </div>
                <div>
                    <label class="form-label">Effective Valuation Date</label>
                    <input class="form-input form-input-sm equity-form-input" type="date" id="input-fmv-date" maxlength="20" required>
                </div>
                <div>
                    <label class="form-label">409A Share Price ($ / share)</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="input-fmv-price" maxlength="20" placeholder="e.g. 150.00" step="0.01" min="1" required>
                </div>
                <div>
                    <label class="form-label">Valuation Context / Notes</label>
                    <input class="form-input form-input-sm equity-form-input" type="text" id="input-fmv-notes" maxlength="250" placeholder="e.g. Annual 409A Valuation">
                </div>
                <div class="equity-form-actions">
                    <button type="submit" class="btn btn-primary btn-sm">Save 409A FMV</button>
                    <button type="button" id="btn-cancel-equity-fmv" class="btn btn-secondary btn-sm">Cancel</button>
                </div>
            </form>
            <div id="fmv-form-status" class="equity-form-status"></div>
        </div>

        <!-- Add Equity Grant Collapsible Form Card -->
        <div id="equity-grant-card" class="equity-form-card is-blue" hidden>
            <div class="equity-form-card-header">
                <h4 class="equity-form-card-title is-blue">+ Add New Equity Grant</h4>
                <button type="button" id="btn-close-equity-grant" class="btn btn-secondary btn-sm">✕ Close</button>
            </div>
            <form id="form-equity-grant" class="equity-form-grid">
                <div>
                    <label class="form-label">Company</label>
                    <select class="form-select form-select-sm equity-form-select" id="input-grant-company">
                        {% if ssr_equity and ssr_equity.companies %}
                            {% for c in ssr_equity.companies %}
                            <option value="{{ c.company_id }}" {% if not is_cons and (c.company_id | string) == (active_cid | string) %}selected{% endif %}>{{ c.company_name }} ({{ c.ticker_or_private }})</option>
                            {% endfor %}
                        {% else %}
                            <option value="1">Primary Company</option>
                        {% endif %}
                        <option value="__new__" class="equity-opt-new-company">+ Add New Company...</option>
                    </select>
                </div>
                <div id="new-company-fields" class="equity-new-company-box" hidden>
                    <div class="equity-new-company-title">
                        Register New Company Holding
                    </div>
                    <div class="equity-new-company-grid">
                        <div>
                            <label class="form-label">Company Name</label>
                            <input type="text" id="input-new-company-name" placeholder="e.g. Acme, Globex, Initech" maxlength="100" class="form-input form-input-sm equity-form-input-surface">
                        </div>
                        <div>
                            <label class="form-label">Initial 409A Share Price ($)</label>
                            <input type="number" id="input-new-company-fmv" maxlength="20" placeholder="10.00" step="0.01" min="0.01" class="form-input form-input-sm equity-form-input-surface">
                        </div>
                    </div>
                </div>
                <div>
                    <label class="form-label">Grant Type</label>
                    <select class="form-select form-select-sm equity-form-select" id="input-grant-type">
                        <option value="nso">Non-Qualified Stock Option (NSO)</option>
                        <option value="iso">Incentive Stock Option (ISO)</option>
                        <option value="rsu">Restricted Stock Unit (RSU)</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Grant Nickname / ID</label>
                    <input class="form-input form-input-sm equity-form-input" type="text" id="input-grant-nickname" maxlength="100" placeholder="e.g. Grant 4" required>
                </div>
                <div>
                    <label class="form-label">Grant Date</label>
                    <input class="form-input form-input-sm equity-form-input" type="date" id="input-grant-date" maxlength="20" required>
                </div>
                <div>
                    <label class="form-label">Fully Vested Date</label>
                    <input class="form-input form-input-sm equity-form-input" type="date" id="input-grant-vested-date" maxlength="20" required>
                </div>
                <div>
                    <label class="form-label">Total Granted Units</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="input-grant-quantity" maxlength="20" placeholder="e.g. 5000" min="1" step="1" required>
                </div>
                <div>
                    <label class="form-label">Strike Price ($ / unit)</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="input-grant-strike" maxlength="20" placeholder="e.g. 10.00" min="0" step="0.01" required>
                    <span id="input-grant-strike-note" class="text-muted equity-strike-note">$0 strike for RSUs</span>
                </div>
                <div>
                    <label class="form-label">Unvested Quantity</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="input-grant-unvested" maxlength="20" placeholder="e.g. 0" min="0" step="1">
                </div>
                <div class="equity-form-actions">
                    <button type="submit" class="btn btn-primary btn-sm">Add Grant</button>
                    <button type="button" id="btn-cancel-equity-grant" class="btn btn-secondary btn-sm">Cancel</button>
                </div>
            </form>
            <div id="grant-form-status" class="equity-form-status"></div>
        </div>

        <!-- Edit Equity Grant Collapsible Form Card -->
        <div id="equity-edit-grant-card" class="equity-form-card" hidden>
            <div class="equity-form-card-header">
                <h4 class="equity-form-card-title" id="equity-edit-grant-title">Edit Equity Grant</h4>
                <button type="button" id="btn-close-edit-equity-grant" class="btn btn-secondary btn-sm">✕ Close</button>
            </div>
            <form id="form-edit-equity-grant" class="equity-form-grid-compact">
                <input type="hidden" id="edit-grant-id">
                <div>
                    <label class="form-label">Company</label>
                    <select class="form-select form-select-sm equity-form-select" id="edit-grant-company">
                        {% if ssr_equity and ssr_equity.companies %}
                            {% for c in ssr_equity.companies %}
                            <option value="{{ c.company_id }}">{{ c.company_name }} ({{ c.ticker_or_private }})</option>
                            {% endfor %}
                        {% else %}
                            <option value="1">Primary Company</option>
                        {% endif %}
                    </select>
                </div>
                <div>
                    <label class="form-label">Grant Type</label>
                    <select class="form-select form-select-sm equity-form-select" id="edit-grant-type">
                        <option value="nso">Non-Qualified Stock Option (NSO)</option>
                        <option value="iso">Incentive Stock Option (ISO)</option>
                        <option value="rsu">Restricted Stock Unit (RSU)</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Grant Nickname / ID</label>
                    <input class="form-input form-input-sm equity-form-input" type="text" id="edit-grant-nickname" maxlength="100" required>
                </div>
                <div>
                    <label class="form-label">Grant Date</label>
                    <input class="form-input form-input-sm equity-form-input" type="date" id="edit-grant-date" maxlength="20" required>
                </div>
                <div>
                    <label class="form-label">Fully Vested Date</label>
                    <input class="form-input form-input-sm equity-form-input" type="date" id="edit-grant-vested-date" maxlength="20">
                </div>
                <div>
                    <label class="form-label">Total Granted Units</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="edit-grant-quantity" maxlength="20" min="1" step="1" required>
                </div>
                <div>
                    <label class="form-label">Strike Price ($ / unit)</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="edit-grant-strike" maxlength="20" min="0" step="0.01" required>
                    <span id="edit-grant-strike-note" class="text-muted equity-strike-note">$0 strike for RSUs</span>
                </div>
                <div>
                    <label class="form-label">Unvested Quantity</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="edit-grant-unvested" maxlength="20" min="0" step="1">
                </div>
                <div>
                    <label class="form-label">Owned / Exercised Shares</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="edit-grant-owned" maxlength="20" min="0" step="1" placeholder="0">
                </div>
                <div>
                    <label class="form-label">Cost Basis ($ / owned share)</label>
                    <input class="form-input form-input-sm equity-form-input" type="number" id="edit-grant-basis" maxlength="20" min="0" step="0.01" placeholder="0.00">
                </div>
                <div class="equity-form-actions">
                    <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                    <button type="button" id="btn-cancel-edit-equity-grant" class="btn btn-secondary btn-sm">Cancel</button>
                </div>
            </form>
            <div id="edit-grant-form-status" class="equity-form-status"></div>
        </div>
