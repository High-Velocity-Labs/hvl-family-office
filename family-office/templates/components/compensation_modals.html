        <!-- Add / Edit Compensation Form Card -->
        <div id="comp-form-card" hidden>
            <div class="comp-form-header">
                <h4 id="comp-form-title">+ Add New Compensation Record</h4>
                <button type="button" id="btn-close-comp-form" class="btn btn-secondary btn-sm">✕ Close</button>
            </div>
            <form id="form-compensation">
                <div>
                    <label class="form-label">Taxpayer</label>
                    <select class="form-select form-select-sm" id="input-comp-user-id">
                        {% if ssr_compensation and ssr_compensation.adults %}
                            {% for a in ssr_compensation.adults %}
                            <option value="{{ a.id }}">{{ a.name }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="1">Household Member</option>
                        {% endif %}
                    </select>
                </div>
                <div>
                    <label class="form-label">Year</label>
                    <input class="form-input form-input-sm comp-input-full" type="number" id="input-comp-year" placeholder="e.g. {{ current_year }}" required min="1990" max="2040">
                </div>
                <div>
                    <label class="form-label">Employer / Company</label>
                    <input class="form-input form-input-sm comp-input-full" type="text" id="input-comp-company" maxlength="100" placeholder="e.g. Employer Name" required>
                </div>
                <div>
                    <label class="form-label">Base Salary ($)</label>
                    <input class="form-input form-input-sm comp-input-full" type="number" id="input-comp-salary" placeholder="e.g. 250000" step="1000" min="0" required>
                </div>
                <div>
                    <label class="form-label">Realized Bonus ($)</label>
                    <input class="form-input form-input-sm comp-input-full" type="number" id="input-comp-bonus" placeholder="e.g. 50000" step="1000" min="0">
                </div>
                <div>
                    <label class="form-label">Source / Notes (optional)</label>
                    <input class="form-input form-input-sm comp-input-full" type="text" id="input-comp-source" maxlength="100" placeholder="e.g. Form W-2 / Transcript">
                </div>
                <div class="comp-form-actions">
                    <button type="submit" class="btn btn-primary btn-sm">Save Record</button>
                    <button type="button" id="btn-cancel-comp-form" class="btn btn-secondary btn-sm">Cancel</button>
                </div>
            </form>
            <div id="comp-form-status"></div>
        </div>
