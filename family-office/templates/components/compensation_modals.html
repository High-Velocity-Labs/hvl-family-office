        <!-- Add / Edit Compensation Form Card -->
        <div id="comp-form-card" style="display: none; background: var(--bg-canvas); border: 1px solid var(--accent-blue); border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                <h4 id="comp-form-title" style="margin: 0; font-size: 0.9375rem; color: var(--accent-blue);">+ Add New Compensation Record</h4>
                <button type="button" id="btn-close-comp-form" class="btn btn-secondary btn-sm">✕ Close</button>
            </div>
            <form id="form-compensation" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; align-items: flex-end;">
                <div>
                    <label class="form-label">Taxpayer</label>
                    <select class="form-select form-select-sm" id="input-comp-user-id" style="width: 100%; background: var(--bg-surface); color: var(--text-primary);">
                        {% if ssr_compensation and ssr_compensation.adults %}
                            {% for a in ssr_compensation.adults %}
                            <option value="{{ a.id }}">{{ a.name }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="1">Household Member</option>
                        {% endif %}
                    </select>
                </div>
                <div>
                    <label class="form-label">Year</label>
                    <input class="form-input form-input-sm" type="number" id="input-comp-year" placeholder="e.g. {{ current_year }}" required min="1990" max="2040" style="width: 100%;">
                </div>
                <div>
                    <label class="form-label">Employer / Company</label>
                    <input class="form-input form-input-sm" type="text" id="input-comp-company" maxlength="100" placeholder="e.g. Employer Name" required style="width: 100%;">
                </div>
                <div>
                    <label class="form-label">Base Salary ($)</label>
                    <input class="form-input form-input-sm" type="number" id="input-comp-salary" placeholder="e.g. 250000" step="1000" min="0" required style="width: 100%;">
                </div>
                <div>
                    <label class="form-label">Realized Bonus ($)</label>
                    <input class="form-input form-input-sm" type="number" id="input-comp-bonus" placeholder="e.g. 50000" step="1000" min="0" style="width: 100%;">
                </div>
                <div>
                    <label class="form-label">Source / Notes (optional)</label>
                    <input class="form-input form-input-sm" type="text" id="input-comp-source" maxlength="100" placeholder="e.g. Form W-2 / Transcript" style="width: 100%;">
                </div>
                <div style="display: flex; gap: 8px;">
                    <button type="submit" class="btn btn-primary btn-sm">Save Record</button>
                    <button type="button" id="btn-cancel-comp-form" class="btn btn-secondary btn-sm">Cancel</button>
                </div>
            </form>
            <div id="comp-form-status" style="margin-top: 8px; font-size: 0.75rem;"></div>
        </div>
