[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hvl-common"
version = "0.2.0"
description = "High Velocity Labs shared core libraries (Auth, AI Resiliency, Security, Testing, Deployment)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "google-auth>=2.23.0",
    "cryptography>=41.0.0",
    "google-genai>=0.1.0",
    "cachetools>=5.3.0",
    "diskcache>=5.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hvl_common*"]

[tool.setuptools.package-data]
"*" = ["*.css", "*.js", "*.svg", "*.ico", "*.html", "*.png", "*.json"]

